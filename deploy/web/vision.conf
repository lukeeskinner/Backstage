# Included inside the web server only when the loopback detector is deployed.
location = /_vision_authorize {
    internal;
    proxy_pass http://incident-api:8000/api/v1/status;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
    access_log off;
}
location = /camera/healthz {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8766/healthz;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    access_log off;
    add_header Cache-Control "no-store" always;
}
location = /camera/detect {
    limit_except POST { deny all; }
    auth_request /_vision_authorize;
    limit_req zone=vision_detect burst=4 nodelay;
    limit_req_status 429;
    client_max_body_size 1m;
    client_body_buffer_size 1m;
    client_body_timeout 5s;
    proxy_pass http://127.0.0.1:8766/detect;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_set_header X-Backstage-Vision "1";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    access_log off;
    add_header Cache-Control "no-store" always;
}
