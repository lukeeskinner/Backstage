# Aggregate overlay for the team-backstage namespace on cluster "backstage".
# The namespace already exists (provisioned by the event), so it is not created here.
# Secrets are created out of band and never committed: badge-secrets (deploy/badge),
# incident-secrets (deploy/incident), and later dash0-credentials and the optional web-openai.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-backstage
resources:
  - ../badge
  - ../incident
  - ../dash0
  - ../web
patches:
  # No registry: build and serve web from stock images (see the file for details).
  - path: web-build-in-cluster.yaml
  # The collector needs the dash0-credentials Secret, which does not exist yet. Its Service
  # still exists, which is all nginx needs to start. Remove this patch once the Secret is created.
  - target:
      kind: Deployment
      name: otel-collector
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
