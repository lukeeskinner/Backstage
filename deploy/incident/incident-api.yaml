apiVersion: v1
kind: Service
metadata:
  name: incident-api
spec:
  selector:
    app.kubernetes.io/name: incident-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: incident-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incident-api
        app.kubernetes.io/part-of: backstage
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-runtime
          image: public.ecr.aws/docker/library/python:3.13-slim
          command: [python, /bootstrap/bootstrap.py]
          env:
            - name: CODE_SHA
              value: f536b757fe510b3af8a4db76a09fd88d81ae6213
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: bootstrap, mountPath: /bootstrap, readOnly: true}
            - {name: runtime, mountPath: /runtime}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: incident-api
          image: public.ecr.aws/docker/library/python:3.13-slim
          command: [python, -m, uvicorn, backstage_api.main:create_app, --factory, --no-access-log, --host, 0.0.0.0, --port, "8000", --workers, "1"]
          envFrom:
            - secretRef: {name: incident-secrets}
          env:
            - {name: APP_MODE, value: live}
            # Keep this revision equal to prepare-runtime CODE_SHA above when releasing.
            - {name: CODE_SHA, value: f536b757fe510b3af8a4db76a09fd88d81ae6213}
            # Bootstrap the isolated evidence alias/mapping before changing to true.
            - {name: EVIDENCE_PROJECTION_ENABLED, value: "false"}
            # Attendee-site pivot. Needs a CODE_SHA that contains backstage_api/pivot.py; a failure never stops startup.
            # Auto bootstrap creates only missing <prefix>-sessions/surveys/agent-ledger/interactions and seeds sessions.
            - {name: PIVOT_ENABLED, value: "false"}
            - {name: PIVOT_AUTO_BOOTSTRAP, value: "false"}
            - {name: OTEL_ENABLED, value: "true"}
            - {name: OTEL_SERVICE_NAME, value: incident-api}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: 'http://otel-collector:4318'}
            - {name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf}
            - {name: OTEL_RESOURCE_ATTRIBUTES, value: 'deployment.environment.name=demo,service.namespace=team-backstage,service.version=$(CODE_SHA)'}
            - {name: PYTHONPATH, value: '/runtime/python:/runtime/repo/services/incident-api'}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: PYTHONUNBUFFERED, value: "1"}
            - {name: BADGE_SERVICE_URL, value: 'http://badge-control:8090'}
            - name: BADGE_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef: {name: badge-secrets, key: BADGE_INTERNAL_TOKEN}
          ports:
            - {name: http, containerPort: 8000}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            timeoutSeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            timeoutSeconds: 5
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: runtime, mountPath: /runtime, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: bootstrap
          configMap: {name: incident-bootstrap}
        - name: runtime
          emptyDir: {}
        - name: tmp
          emptyDir: {}
