name: Scaffold checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scaffold-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-check.txt
            services/incident-api/requirements*.txt
      - run: python -m pip install -r requirements-check.txt
      - run: python -m pip install -r services/incident-api/requirements-test.txt
      - run: make check
      - run: make check-api
      - name: Test attendee site worker
        run: PYTHONPATH=services/agent-workers python -m unittest discover -s services/agent-workers/tests
      - run: |
          make smoke SCENARIO=overflow
          make smoke SCENARIO=stage_av
          make smoke SCENARIO=badge_stall

  changed-paths:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - name: Check lane using base branch rules
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
          test "$(git rev-parse FETCH_HEAD)" = "$PR_HEAD"
          python3 scripts/check_changed_paths.py --base "$PR_BASE" --head "$PR_HEAD" --author "$PR_AUTHOR" --branch "$PR_BRANCH"
